name: StudioDaff SD-AI-001 Validation

on:
  push:
    branches:
      - feature/sd-ai-001-conversion-foundation
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: https://studiodaff.com
        run: npm run build

  production-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high

  security-upgrade-probe:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install proposed upgrades (no repository writes)
        run: |
          npm ci
          npm install --save-exact next@16.4.2 @next/third-parties@16.4.2 eslint-config-next@16.4.2
          npm audit fix || true
      - name: Audit production packages after upgrade
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: https://studiodaff.com
        run: npm run build
      - name: Commit verified lockfile changes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): upgrade Next.js and audited production dependencies"
            git push origin HEAD:feature/sd-ai-001-conversion-foundation
          fi
